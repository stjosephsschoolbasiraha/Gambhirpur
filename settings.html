<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Settings | School ERP</title>

    <link rel="stylesheet" href="settings.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="settings-page">

    <!-- Header -->

    <div class="page-header">

        <div>

            <h1>Settings</h1>

            <p>Manage your School ERP preferences</p>

        </div>

    </div>



    <!-- Settings Container -->

    <div class="settings-container">



        <!-- School Profile -->

        <div class="setting-item" id="schoolProfile">

            <div class="setting-left">

                <div class="setting-icon school">

                    <i class="fa-solid fa-school"></i>

                </div>

                <div class="setting-text">

                    <h3>School Profile</h3>

                    <p>School information, logo and contact details</p>

                </div>

            </div>

            <div class="setting-right">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </div>



        <!-- Theme -->

        <div class="setting-item" id="theme">

            <div class="setting-left">

                <div class="setting-icon theme">

                    <i class="fa-solid fa-palette"></i>

                </div>

                <div class="setting-text">

                    <h3>Theme</h3>

                    <p>Customize colors and appearance</p>

                </div>

            </div>

            <div class="setting-right">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </div>



        <!-- Backup -->

        <div class="setting-item" id="backup">

            <div class="setting-left">

                <div class="setting-icon backup">

                    <i class="fa-solid fa-database"></i>

                </div>

                <div class="setting-text">

                    <h3>Backup & Restore</h3>

                    <p>Export or Import ERP data</p>

                </div>

            </div>

            <div class="setting-right">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </div>



        <!-- About -->

        <div class="setting-item" id="about">

            <div class="setting-left">

                <div class="setting-icon about">

                    <i class="fa-solid fa-circle-info"></i>

                </div>

                <div class="setting-text">

                    <h3>About</h3>

                    <p>System information & version</p>

                </div>

            </div>

            <div class="setting-right">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </div>



    </div>

</div>

<script src="settings.js"></script>

</body>
</html>
